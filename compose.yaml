name: skyconnect
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: db_aeroport
    command: ["--secure-file-priv=/var/lib/mysql-files"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./data:/var/lib/mysql-files:ro
      - ./database:/workspace/database:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [backend]
  phpmyadmin:
    image: phpmyadmin:5.2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "127.0.0.1:${PMA_HTTP_PORT:-8081}:80"
    networks: [backend]
volumes:
  mysql-data:
networks:
  backend:
    driver: bridge

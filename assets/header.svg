<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 235" role="img" aria-labelledby="title desc">
  <title id="title">SkyConnect-DB</title><desc id="desc">Airport database engineering banner with subtle animated route</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1728"/><stop offset="1" stop-color="#12465a"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#a3cfdb" stroke-opacity=".08"/></pattern></defs>
  <rect width="1000" height="235" rx="16" fill="url(#bg)"/><rect width="1000" height="235" rx="16" fill="url(#grid)"/>

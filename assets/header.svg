  <g fill="#75dfe7"><circle cx="25" cy="185" r="4"/><circle cx="980" cy="46" r="4"/></g>
  <rect x="74" y="42" width="850" height="150" rx="12" fill="#0b1728" fill-opacity=".80"/>
